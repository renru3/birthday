<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝任瑞瑞生日快乐！🎉 礼物挑选站</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 50%, #7dd3fc 100%);
            min-height: 100vh;
        }
        .fun-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }
        .polaroid-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .polaroid-card:hover {
            transform: rotate(-1deg) scale(1.02);
        }
        .gift-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gift-card:hover {
            transform: translateY(-4px);
        }
        .gift-card.selected {
            border-color: #0284c7;
            background-color: #f0f9ff;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.3), 0 8px 10px -6px rgba(14, 165, 233, 0.2);
        }
        .step-enter {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <!-- 顶部庆祝装饰彩带背景 -->

        <span class="text-3xl animate-bounce" style="animation-delay: 0.4s;">✨</span>
        <span class="text-3xl animate-bounce" style="animation-delay: 0.5s;">🎁</span>
    </div>

        function selectGift(id, name) {

                card.querySelector('.check-icon').classList.add('opacity-0');
            });

            activeCard.querySelector('.check-icon').classList.remove('opacity-0');

            document.getElementById('step-dot-1').querySelector('span').className = 'w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs';
            
            document.getElementById('step-dot-2').className = 'flex items-center gap-2 text-sky-600 font-bold';
            document.getElementById('step-dot-2').querySelector('span').className = 'w-6 h-6 rounded-full bg-sky-600 text-white flex items-center justify-center text-xs';
            document.getElementById('step-line').className = 'w-12 h-0.5 bg-sky-600';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToStep1() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');

            document.getElementById('step-dot-2').className = 'flex items-center gap-2 text-slate-400';
            document.getElementById('step-dot-2').querySelector('span').className = 'w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs';
            
            document.getElementById('step-dot-1').className = 'flex items-center gap-2 text-sky-600 font-bold';
            document.getElementById('step-dot-1').querySelector('span').className = 'w-6 h-6 rounded-full bg-sky-600 text-white flex items-center justify-center text-xs';
            document.getElementById('step-line').className = 'w-12 h-0.5 bg-slate-200';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitForm(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const note = document.getElementById('note').value.trim();
            const submitButton = e.submitter;
            const originalButtonHtml = submitButton.innerHTML;

            formattedText = `🎂 生日礼物选择\n----------------------\n🎁 选中礼物：${selectedGiftName}\n👤 收件人：${name}\n📱 电话：${phone}\n📍 收货地址：${address}${note ? '\n📝 备注要求：' + note : ''}`;

            submitButton.disabled = true;
            submitButton.classList.add('opacity-70', 'cursor-not-allowed');
            submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在发送...';

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        access_key: '7c696623-20f8-4b27-a734-7f0103e2f4e8',
                        subject: '生日礼物选择',
                        from_name: 'Birthday Gift Website',
                        selected_gift: selectedGiftName,
                        recipient_name: name,
                        phone: phone,
                        address: address,
                        note: note || '无',
                        message: formattedText
                    })
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || '邮件服务返回失败');
                }

                document.getElementById('final-gift').innerText = selectedGiftName;
                document.getElementById('final-name').innerText = name;
                document.getElementById('final-phone').innerText = phone;
                document.getElementById('final-address').innerText = address;

                const noteWrapper = document.getElementById('final-note-wrapper');
                if (note) {
                    document.getElementById('final-note').innerText = note;
                    noteWrapper.classList.remove('hidden');
                } else {
                    noteWrapper.classList.add('hidden');
                }

                copyToClipboard(formattedText);
                document.getElementById('step-2').classList.add('hidden');
                document.getElementById('step-3').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                console.error(error);
                alert('发送失败：' + error.message + '。请检查网络后重新提交。');
            } finally {
                submitButton.disabled = false;
                submitButton.classList.remove('opacity-70', 'cursor-not-allowed');
                submitButton.innerHTML = originalButtonHtml;
            }
        }

        function copyFormattedText() {
            copyToClipboard(formattedText);
            alert('已复制地址信息到剪贴板，去微信粘贴发送吧！');
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
        }
    </script>
</body>
</html>
